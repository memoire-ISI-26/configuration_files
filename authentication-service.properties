spring.config.import=optional:configserver:resilience
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# JWT Configuration
# Secret Base64 encode (defini dans les variables d'environnement / .env)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# URL interne du user-service (via Eureka load balancer)
user-service.url=http://user-service
