# Configuration globale Feign & Resilience4j
spring.cloud.openfeign.circuitbreaker.enabled=true

# Taille de la fenêtre glissante pour l'enregistrement des appels (défaut: 100)
resilience4j.circuitbreaker.instances.default.slidingWindowSize=10

# Taux d'échec (%) au-delà duquel le circuit bascule à l'état OPEN
resilience4j.circuitbreaker.instances.default.failureRateThreshold=50

# Temps pendant lequel le circuit reste à l'état OPEN avant de basculer en HALF-OPEN
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=15s

# Nombre d'appels autorisés en état HALF-OPEN
resilience4j.circuitbreaker.instances.default.permittedNumberOfCallsInHalfOpenState=3

# Limite de temps pour les appels (timeout)
resilience4j.timelimiter.instances.default.timeoutDuration=3s
