spring-cloud-gateway.uriport=8765

# JWT Configuration
jwt.secret=${JWT_SECRET}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Gateway discovery locator
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Gateway route configuration
spring.cloud.gateway.routes[0].id=authentication-service
spring.cloud.gateway.routes[0].uri=lb://authentication-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=wallet-service
spring.cloud.gateway.routes[2].uri=lb://wallet-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/transactions/**

spring.cloud.gateway.routes[3].id=wallet-service
spring.cloud.gateway.routes[3].uri=lb://wallet-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/accounts/**

spring.cloud.gateway.routes[4].id=pricing-service
spring.cloud.gateway.routes[4].uri=lb://pricing-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/pricing/**

spring.cloud.gateway.routes[5].id=tracking-service
spring.cloud.gateway.routes[5].uri=lb://tracking-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/tracking/**

spring.cloud.gateway.routes[6].id=personnalisation-service
spring.cloud.gateway.routes[6].uri=lb://personnalisation-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/personnalisation/**

# Swagger UI Aggregation - Centralized API Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=1. Python FastAPI (DQN Recommender)
springdoc.swagger-ui.urls[0].url=http://localhost:8000/openapi.json
springdoc.swagger-ui.urls[1].name=2. Authentication Service
springdoc.swagger-ui.urls[1].url=http://localhost:8081/v3/api-docs
springdoc.swagger-ui.urls[2].name=3. User Service
springdoc.swagger-ui.urls[2].url=http://localhost:8101/v3/api-docs
springdoc.swagger-ui.urls[3].name=4. Pricing Service
springdoc.swagger-ui.urls[3].url=http://localhost:8201/v3/api-docs
springdoc.swagger-ui.urls[4].name=5. Wallet Service
springdoc.swagger-ui.urls[4].url=http://localhost:8301/v3/api-docs
springdoc.swagger-ui.urls[5].name=6. Personnalisation Service
springdoc.swagger-ui.urls[5].url=http://localhost:8401/v3/api-docs
springdoc.swagger-ui.urls[6].name=7. Tracking Service
springdoc.swagger-ui.urls[6].url=http://localhost:8501/v3/api-docs